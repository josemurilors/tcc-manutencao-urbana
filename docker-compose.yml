services:
  nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-dev}
        - BUILD_DATE=${BUILD_DATE:-dev}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cloudflare:/etc/cloudflare:ro
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - uploads:/app/uploads:ro
    depends_on:
      - backend
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 64M
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    profiles:
      - certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: manutencao_urbana
      POSTGRES_USER: urbana
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # ports: descomentar apenas para debug externo
    #   - "5432:5432"
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=384MB
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbana -d manutencao_urbana"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M
    restart: unless-stopped

  backend:
    container_name: chamados-manutencao-urbana
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    # SECURITY: Port removed — backend accessible only via nginx reverse proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment: &backend-env
      - DJANGO_SETTINGS_MODULE=core.settings.production
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD is required}
      - FRONTEND_URL=https://${DOMAIN:-localhost}
      - IA_URL=http://ia:8000
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=manutencao_urbana
      - DB_USER=urbana
      - DB_PASSWORD=${DB_PASSWORD}
      - PRIVACY_BLUR_SIGMA=${PRIVACY_BLUR_SIGMA:-0.6}
      - PERIMETER_BUFFER_DEG=${PERIMETER_BUFFER_DEG:-0.01}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EXPO_PUSH_ENABLED=${EXPO_PUSH_ENABLED:-1}
      - EXPO_ACCESS_TOKEN=${EXPO_ACCESS_TOKEN:-}
      - GOOGLE_CLIENT_ID_WEB=${GOOGLE_CLIENT_ID_WEB:-}
      - GOOGLE_CLIENT_ID_ANDROID=${GOOGLE_CLIENT_ID_ANDROID:-}
      - GOOGLE_CLIENT_ID_IOS=${GOOGLE_CLIENT_ID_IOS:-}
      - FROM_EMAIL=${FROM_EMAIL:-Central Urbana <onboarding@resend.dev>}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,backend}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-false}
    volumes:
      - uploads:/app/uploads
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped

  # Agendador: mesma imagem do backend rodando `entrypoint.sh agendador`
  # (alertas_sla de hora em hora; resumo_semanal às segundas, 8h, America/Sao_Paulo).
  # Logs: docker compose logs -f scheduler
  scheduler:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    command: ["agendador"]
    environment: *backend-env
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  ia:
    profiles: ["ia"]
    build:
      context: ./ia
      dockerfile: Dockerfile
    # SECURITY: Port removed — IA accessible only internally
    environment:
      - PYTHON_ENV=production
      - CLASSIFICATION_API_KEY=${HUGGINGFACE_API_TOKEN:-}
      - CLASSIFICATION_API_URL=${CLASSIFICATION_API_URL:-https://api-inference.huggingface.co/models/facebook/bart-large-mnli}
      - CLASSIFICATION_FORMAT=${CLASSIFICATION_FORMAT:-huggingface}
      - CLASSIFICATION_CATEGORIES=${CLASSIFICATION_CATEGORIES:-Buraco,Iluminacao,Semafaro,Arvore Caida,Entulho,Calcada Danificada,Outro}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; r=urllib.request.urlopen('http://localhost:8000/health'); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 350M
    restart: unless-stopped

  backup:
    profiles: ["backup"]
    image: alpine:3.19
    environment:
      - DB_NAME=manutencao_urbana
      - DB_USER=urbana
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_HOST=postgres
      - DB_PORT=5432
      - BACKUP_DIR=/backups
      - RETENTION_DAYS=30
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - RCLONE_DEST=${RCLONE_DEST:-}
    volumes:
      - ./scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    entrypoint: >
      sh -c "
        apk add --no-cache postgresql-client curl &&
        echo '0 3 * * * /bin/sh /usr/local/bin/backup-postgres.sh' | crontab - &&
        echo 'Servico de backup iniciado — executa diariamente as 03:00' &&
        crond -f -l 2
      "

volumes:
  postgres-data:
  uploads:
  backend-logs:
  certbot-data:
  certbot-www:
  backups:

networks:
  app-network:
    driver: bridge
