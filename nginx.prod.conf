upstream backend {
    server backend:8000;
    keepalive 64;
}

# Cloudflare IP ranges — real visitor IP recovery
# https://www.cloudflare.com/ips-v4, https://www.cloudflare.com/ips-v6
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2c0f:f248::/32;
set_real_ip_from 2a06:98c0::/29;
# Túnel Cloudflare (bloco :8080): quem conecta é o `cloudflared`, na rede privada
# do Docker. Sem isto o $remote_addr de todos os usuários vira o IP do túnel e os
# limites por IP do backend viram um limite global do site.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

server {
    listen 80;
    server_name tcc.josemurilors.com.br;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# Um bloco só para os dois acessos: o túnel da Cloudflare (:8080, TLS termina
# na borda) e o HTTPS direto (:443). Antes eram duas cópias, e só a do :443
# tinha cabeçalhos de segurança, justamente a que o tráfego não usa.
server {
    listen 8080;
    listen 443 ssl;
    http2 on;
    server_name tcc.josemurilors.com.br lab.josemurilors.com.br www.josemurilors.com.br josemurilors.com.br;
    server_tokens off;

    ssl_certificate /etc/cloudflare/cert.pem;
    ssl_certificate_key /etc/cloudflare/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Valem para todas as respostas porque nenhum location usa add_header (um
    # add_header no location cancela todos estes; para cache, use `expires`).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # O app usa GPS (posição do chamado) e câmera (foto do defeito) no próprio domínio.
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    # allow-popups: o login com Google (Identity Services) abre janela própria.
    # Sem COEP require-corp: bloquearia os tiles do mapa e o botão do Google.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    client_max_body_size 10M;
    # Location relativo: no túnel o nginx escuta na 8080, e um redirect absoluto
    # levaria o usuário para http://...:8080.
    absolute_redirect off;

    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Endereços do antigo frontend React -> telas equivalentes do app.
    location = /lista { return 301 /operacao; }
    location = /admin/dashboard { return 301 /painel; }
    location = /config { return 301 /conta; }
    location = /configuracoes { return 301 /conta; }

    # Bundles do app (expo export) têm hash no nome: podem ficar em cache.
    location /_expo/ {
        root /usr/share/nginx/html;
        expires 1y;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # Cache-Control: no-cache (o index.html aponta para o bundle da versão atual).
        expires -1;
    }
}
