services:
  nginx:
    image: nginx-frontend:latest
    network_mode: host
    volumes:
      - ./nginx.host.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 64M
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_DB: manutencao_urbana
      POSTGRES_USER: urbana
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=384MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbana -d manutencao_urbana"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    network_mode: host
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M
    restart: unless-stopped

  backend:
    container_name: chamados-manutencao-urbana
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    network_mode: host
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment: &backend-env
      - DJANGO_SETTINGS_MODULE=core.settings.production
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
      - FRONTEND_URL=https://${DOMAIN:-localhost}
      - IA_URL=http://localhost:8001
      - REDIS_URL=redis://localhost:6379/0
      - DB_HOST=127.0.0.1
      - DB_PORT=5432
      - DB_NAME=manutencao_urbana
      - DB_USER=urbana
      - DB_PASSWORD=${DB_PASSWORD}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EXPO_PUSH_ENABLED=${EXPO_PUSH_ENABLED:-1}
      - EXPO_ACCESS_TOKEN=${EXPO_ACCESS_TOKEN:-}
      - GOOGLE_CLIENT_ID_WEB=${GOOGLE_CLIENT_ID_WEB:-}
      - GOOGLE_CLIENT_ID_ANDROID=${GOOGLE_CLIENT_ID_ANDROID:-}
      - GOOGLE_CLIENT_ID_IOS=${GOOGLE_CLIENT_ID_IOS:-}
      - FROM_EMAIL=${FROM_EMAIL:-Central Urbana <onboarding@resend.dev>}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,backend}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
    restart: unless-stopped

  # Agendador: mesma imagem do backend rodando `entrypoint.sh agendador`
  # (alertas_sla de hora em hora; resumo_semanal às segundas, 8h, America/Sao_Paulo).
  # Logs: docker compose logs -f scheduler
  scheduler:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    command: ["agendador"]
    environment: *backend-env
    network_mode: host
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  ia:
    profiles: ["ia"]
    build:
      context: ./ia
      dockerfile: Dockerfile
    network_mode: host
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    environment:
      - PYTHON_ENV=production
      - CLASSIFICATION_API_KEY=${HUGGINGFACE_API_TOKEN:-}
      - CLASSIFICATION_API_URL=${CLASSIFICATION_API_URL:-https://api-inference.huggingface.co/models/facebook/bart-large-mnli}
      - CLASSIFICATION_FORMAT=${CLASSIFICATION_FORMAT:-huggingface}
      - CLASSIFICATION_CATEGORIES=${CLASSIFICATION_CATEGORIES:-Buraco,Iluminacao,Semafaro,Arvore Caida,Entulho,Calcada Danificada,Outro}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; r=urllib.request.urlopen('http://localhost:8001/health'); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 350M
    restart: unless-stopped

volumes:
  postgres-data:
  uploads:
  backend-logs:
  certbot-data:
  certbot-www:
